name: Sync Masterlist

on:
  schedule:
    - cron: '0 12 * * *'  # 9h BRT
    - cron: '0 0 * * *'   # 21h BRT (meia-noite UTC)
  workflow_dispatch:        # permite rodar manualmente também
    inputs:
      simulacao:
        description: 'Só simular: lê a planilha e o banco e mostra o que seria feito, sem gravar nada'
        type: boolean
        default: false

concurrency:
  group: sync-masterlist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install
        working-directory: scripts

      - name: Rodar sync
        run: node sync-masterlist.js
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SYNC_DRY_RUN: ${{ inputs.simulacao && '1' || '' }}  # 1 = simulação (disparo manual com a opção marcada); nunca grava
          # MESMAS PROTEÇÕES do "Sync controlado" (decisão de 16/11/2026, depois de um run sem elas desmarcar pagamentos e voltar status de itens já enviados). Fixas neste arquivo:
          SYNC_SEM_EXCLUSAO: '1'            # nenhuma exclusão (prune_masterlist nem é chamada); exclusão volta só por decisão explícita
          SYNC_PROTEGER: '1'                # nunca troca o dono de linha existente, nunca desmarca pagamento, nunca faz o status andar para trás, retém inserção excedente
          SYNC_REGISTRO: '1'                # plano com valores anteriores no registro PRIVADO antes de gravar (sem ele nada é gravado) + validação e resultado depois
          SYNC_JOINERS: 'somente-novos'     # cria cadastro que não existe; não altera nenhum cadastro existente
          SYNC_ENVIAR_PUSH: ''              # sem push/notificações até decisão explícita
