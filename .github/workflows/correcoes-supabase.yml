name: Correções Supabase (ensaio por padrão)

# SÓ DISPARO MANUAL (sem cron/push/pull_request). Por padrão é ENSAIO: lista o que mudaria e NÃO grava. Só grava com "aplicar" marcado.
# Cada correção reconfere o estado atual antes de gravar e mexe apenas nos casos inequívocos. Nada é apagado. Antes de gravar, o plano com os valores anteriores vai para um registro PRIVADO e durável (bucket privado do Supabase); sem ele, nada é gravado.
# O log deste repositório é PÚBLICO: o script imprime só contagens, ids, códigos de item, CEG e nome de produto — nunca @, e-mail, nome de pessoa, CPF ou endereço.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'Qual correção'
        type: choice
        options: [todas, email, demandas, registrar-aplicadas, verificar-registro, reverter, arquivar-copias, sync-indevido, arquivar-pares, liberar-itens, trocar-email, enviar-codigo]
        default: todas
      aplicar:
        description: 'GRAVAR de verdade (desmarcado = ensaio, não grava)'
        type: boolean
        default: false
      ids:
        description: 'Para as ações arquivar-copias e liberar-itens: ids das linhas da masterlist (até 10, separados por vírgula). Cada uma é reprovada na hora; só arquiva cópia provada e livre'
        type: string
        default: ''
      pares:
        description: 'Só para a ação arquivar-pares: pares duplicada:preservada separados por vírgula (até 10). Cada par é reprovado na hora; a preservada nunca é tocada'
        type: string
        default: ''
      email_hash:
        description: 'Só para a ação trocar-email: 8 hex do sha256 do e-mail novo em minúsculas (o e-mail em si nunca entra aqui; ids = id do cadastro)'
        type: string
        default: ''
      registro:
        description: 'Só para a ação reverter: caminho do registro privado de RESULTADO (ex.: correcoes/..._resultado.json). Vazio = lista os registros existentes'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: correcoes-supabase
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install
        working-directory: scripts

      - name: Correções (ensaio, ou gravação se "aplicar")
        run: node corrigir-supabase.mjs
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACAO: ${{ inputs.acao }}
          APLICAR: ${{ inputs.aplicar && '1' || '' }}
          REGISTRO: ${{ inputs.registro }}
          IDS: ${{ inputs.ids }}
          PARES: ${{ inputs.pares }}
          EMAIL_HASH: ${{ inputs.email_hash }}
