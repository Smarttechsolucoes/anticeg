name: Auditoria Supabase (somente leitura)

# SÓ DISPARO MANUAL (sem cron, sem push, sem pull_request). Não grava NADA no banco: faz SELECTs e, se marcado, a SIMULAÇÃO do sync (SYNC_DRY_RUN=1).
# O log deste repositório é PÚBLICO: os scripts imprimem só contagens, ids de linha, códigos de item e nomes de produto — nunca @, e-mail, nome de pessoa, CPF ou endereço.
# Usa os segredos que o sync já usa (SUPABASE_URL / SUPABASE_SERVICE_KEY). O valor deles não aparece no log (o GitHub mascara).
on:
  workflow_dispatch:
    inputs:
      auditoria:
        description: 'Rodar a auditoria de integridade do banco (somente leitura)'
        type: boolean
        default: true
      referencias:
        description: 'Rodar a parte 2 (esquema e referências quebradas x arquivo; somente leitura)'
        type: boolean
        default: false
      investigacao:
        description: 'Rodar a investigação das pendências ambíguas (pares, demandas, repasses; somente leitura)'
        type: boolean
        default: false
      investigacao2:
        description: 'Rodar a investigação 2 (compara dono/e-mail/@ da planilha com o banco; somente leitura; log só com marcas e sim/não)'
        type: boolean
        default: false
      dicon:
        description: 'Rodar a investigação 4 (DICON: formulário x masterlist x planilha; valores dos repasses e demandas dos casos; somente leitura)'
        type: boolean
        default: false
      precos:
        description: 'Investigar preço em branco x zero (somente leitura)'
        type: boolean
        default: false
      pos_sync:
        description: 'Verificar o estado do banco depois de um sync (somente leitura): pagamentos, donos, status, duplicatas, inserções, cadastros e contas'
        type: boolean
        default: false
      candidatas:
        description: 'Ids das candidatas à exclusão (separados por vírgula) para examinar UMA A UMA (somente leitura). Vazio = não roda'
        type: string
        default: ''
      controlado:
        description: 'Na SIMULAÇÃO, usar as mesmas proteções do sync controlado (sem exclusões, dono e pagamento protegidos, cadastros: nenhum). Só afeta o que a simulação mostra; nada é gravado'
        type: boolean
        default: false
      simulacao:
        description: 'Rodar a SIMULAÇÃO do sync contra a planilha atual (somente leitura, não grava)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: auditoria-supabase
  cancel-in-progress: false

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install
        working-directory: scripts

      - name: Auditoria do banco (somente leitura)
        if: ${{ inputs.auditoria }}
        run: node auditar-supabase.mjs
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Referências quebradas e esquema (somente leitura)
        if: ${{ inputs.referencias }}
        run: node auditar-referencias.mjs
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Investigação das pendências (somente leitura)
        if: ${{ inputs.investigacao }}
        run: node investigar-pendencias.mjs
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Investigação 2 - planilha x banco (somente leitura)
        if: ${{ inputs.investigacao2 }}
        run: node investigar-pendencias-2.mjs
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Investigação 4 - DICON e valores (somente leitura)
        if: ${{ inputs.dicon }}
        run: node investigar-dicon-e-valores.mjs
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Preço em branco x zero (somente leitura)
        if: ${{ inputs.precos }}
        run: node investigar-precos.mjs
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Verificação posterior a um sync (somente leitura)
        if: ${{ inputs.pos_sync }}
        run: node verificar-pos-sync.mjs
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Candidatas à exclusão, uma a uma (somente leitura)
        if: ${{ inputs.candidatas != '' }}
        run: node investigar-candidatas.mjs
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IDS: ${{ inputs.candidatas }}

      - name: Simulação do sync (não grava)
        if: ${{ inputs.simulacao }}
        run: node sync-masterlist.js
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SYNC_DRY_RUN: '1'
          SYNC_SEM_EXCLUSAO: ${{ inputs.controlado && '1' || '' }}
          SYNC_PROTEGER: ${{ inputs.controlado && '1' || '' }}
          SYNC_JOINERS: ${{ inputs.controlado && 'nenhum' || 'todos' }}
          SYNC_ENVIAR_PUSH: ''
